  workspace-identity:
    name: Dev Container and rootless Podman identity
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install identity-mode prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y acl crun podman uidmap
          npm install --global "@devcontainers/cli@$DEVCONTAINER_VERSION"

      - name: Create controlled non-1000 fixture identity
        shell: bash
        run: |
          set -euo pipefail
          fixture_user=cyclestone-fixture
          fixture_uid=2001
          fixture_gid=2002
          shared_gid=2003
          sudo groupadd --gid "$fixture_gid" "$fixture_user"
          sudo groupadd --gid "$shared_gid" cyclestone-shared
          sudo useradd --uid "$fixture_uid" --gid "$fixture_gid" \
            --groups docker,cyclestone-shared --create-home --shell /bin/bash "$fixture_user"
          for target in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
            path=$target
            while test "$path" != /; do
              sudo setfacl -m "u:$fixture_user:--x" "$path"
              path=$(dirname "$path")
            done
          done
          sudo setfacl -m "u:$fixture_user:r-x" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          if ! grep -q "^$fixture_user:" /etc/subuid; then
            sudo usermod --add-subuids 300000-365535 "$fixture_user"
          fi
          if ! grep -q "^$fixture_user:" /etc/subgid; then
            sudo usermod --add-subgids 300000-365535 "$fixture_user"
          fi
          sudo install -d -m 0700 -o "$fixture_uid" -g "$fixture_gid" "/run/user/$fixture_uid"
          sudo install -d -m 2770 -o root -g "$shared_gid" "$RUNNER_TEMP/cyclestone-group-access"
          install -d -m 0755 "$GITHUB_WORKSPACE/dist/evidence/workspace-identity"
          sudo install -d -m 0755 -o "$fixture_uid" -g "$fixture_gid" \
            "$GITHUB_WORKSPACE/dist/evidence/workspace-identity/devcontainer" \
            "$GITHUB_WORKSPACE/dist/evidence/workspace-identity/podman"
          sudo -u "$fixture_user" test -x "$GITHUB_WORKSPACE/tests/devcontainer.sh"
          sudo -u "$fixture_user" test -x "$GITHUB_WORKSPACE/tests/rootless-podman.sh"

      - name: Build identity validation image
        shell: bash
        run: |
          set -euo pipefail
          export IMAGE_CREATED
          IMAGE_CREATED=$(date -u -d "$(git show -s --format=%cI HEAD)" +%Y-%m-%dT%H:%M:%SZ)
          IMAGE_TAG=cyclestone-base:workspace-identity ./scripts/build-base.sh load
          docker save --output dist/cyclestone-workspace-identity.tar cyclestone-base:workspace-identity
          setfacl -m u:cyclestone-fixture:r-- dist/cyclestone-workspace-identity.tar
          sudo -u cyclestone-fixture test -r dist/cyclestone-workspace-identity.tar

      - name: Validate Dev Container UID and GID mutation
        shell: bash
        run: |
          sudo -u cyclestone-fixture env \
            HOME=/home/cyclestone-fixture \
            PATH="$PATH" \
            CYCLESTONE_VALIDATION_IMAGE=cyclestone-base:workspace-identity \
            EVIDENCE_DIR="$GITHUB_WORKSPACE/dist/evidence/workspace-identity/devcontainer" \
            "$GITHUB_WORKSPACE/tests/devcontainer.sh"

      - name: Validate rootless Podman keep-id
        shell: bash
        run: |
          set -euo pipefail
          sudo -u cyclestone-fixture env \
            HOME=/home/cyclestone-fixture \
            XDG_RUNTIME_DIR=/run/user/2001 \
            podman load --input "$GITHUB_WORKSPACE/dist/cyclestone-workspace-identity.tar"
          sudo -u cyclestone-fixture env \
            HOME=/home/cyclestone-fixture \
            XDG_RUNTIME_DIR=/run/user/2001 \
            IMAGE=cyclestone-base:workspace-identity \
            IDENTITY_GROUP_PATH="$RUNNER_TEMP/cyclestone-group-access" \
            IDENTITY_GROUP_GID=2003 \
            EVIDENCE_DIR="$GITHUB_WORKSPACE/dist/evidence/workspace-identity/podman" \
            "$GITHUB_WORKSPACE/tests/rootless-podman.sh"

      - name: Upload workspace identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-identity-evidence
          path: dist/evidence/workspace-identity
          if-no-files-found: error
          retention-days: 30

