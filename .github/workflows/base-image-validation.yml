name: Base image native validation

on:
  workflow_dispatch:
    inputs:
      run_multiarch:
        description: Build the combined OCI archive with Docker Build Cloud
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: base-image-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_VERSION: 1.0.0-validation.${{ github.run_id }}
  IMAGE_REVISION: ${{ github.sha }}
  IMAGE_LICENSES: LicenseRef-Container-Image-Review-Required
  DEVCONTAINER_VERSION: 0.86.0

jobs:
  static:
    name: Static and fixture checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies for static and runtime checks
        run: |
          sudo apt-get update
          sudo apt-get install -y socat shellcheck
          npm install --global "@devcontainers/cli@${{ env.DEVCONTAINER_VERSION }}"

      - name: Run repository contracts
        run: ./tests/contracts.sh

      - name: Run ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x

      - name: Run provider registry validation
        run: ./tests/provider-registry.sh

      - name: Run provider authorization validation
        run: ./tests/provider-authorization.sh

      - name: Run child image static validation
        run: ./tests/child-image-static.sh

      - name: Run runtime configuration validation
        run: ./tests/runtime-config.sh

